<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema 7 &mdash; CSS</title>

    <style>

        h1, h2, h3 {
            text-transform: uppercase;
        }

        h1 {
            letter-spacing: 8px;
            word-spacing: 7px;
        }
        h2 {
            letter-spacing: 7px;
            word-spacing: 6px;
        }
        h3 {
            letter-spacing: 6px;
            word-spacing: 5px;
        }

    </style>
</head>
<body>
   
    <h1>Este es un título de nivel 1</h1>
    <h2>Este es un título de nivel 2</h2>
    <h3>Este es un título de nivel 3</h3>
   
</body>
</html>
