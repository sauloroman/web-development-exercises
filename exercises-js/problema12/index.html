<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema 12</title>
</head>
<body>
    <script>
        let base = 11
        let i = 1

        document.write('<h2>Problema 12.1</h2>')
        while ( i <= 25 ) {
            document.write("<p>" + i + ". Numero: " + base + " </p>")
            base += 11
            i++
        }

        document.write('<h2>Problema 12.2</h2>')
        let num = 8
        while ( num <= 500 ) {
            document.write("<p> Numero: " + num + " </p>")
            num += 8
        }

    </script>
</body>
</html>
