<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema 6</title>
</head>
<body>
    <script>
        document.write("<h2>Problema 6.1</h2>")
        const nota1 = parseFloat(prompt("Ingrese nota 1: "))
        const nota2 = parseFloat(prompt("Ingrese nota 2: "))
        const nota3 = parseFloat(prompt("Ingrese nota 3: "))
        const promedio = (nota1 + nota2 + nota3 ) / 3
        document.write("<p>Promedio: " + promedio + " </p>")
        
        document.write("<h2>Problema 6.2</h2>")
        const clave1 = parseFloat(prompt("Clave 1: "))
        const clave2 = parseFloat(prompt("Clave 2: "))
        const areEqual = clave1 === clave2
        document.write("<p>Son iguales: " + (areEqual ? "Sí" : "No") + " </p>")
    </script>
</body>
</html>
