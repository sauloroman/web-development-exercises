<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema 10</title>
</head>
<body>
    <script>
        const num1 = parseInt(prompt("1.Ingresa un numero: "))
        const num2 = parseInt(prompt("2.Ingresa un numero: "))
        const num3 = parseInt(prompt("3.Ingresa un numero: "))

        if ( num1 < 10 || num2 < 10 || num3 < 10 ) {
            document.write("Alguno de los números es menor a diez")
        } else {
            document.write("Ninguno de los números es menor a diez")
        }
    </script>
</body>
</html>
