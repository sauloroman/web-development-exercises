<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema 5</title>
</head>
<body>
    <script>
        
        //Problema 1
        document.write("<h2>Problema 5.1</h2>")
        const size = parseFloat(prompt("Ingresa lado del cuadrado: "))
        const perimeter = size * 4
        document.write("<p>Longitud del lado: " + size + " </p>")
        document.write("<p>Perímetro del cuadrado: " + perimeter + " </p>")

        //Problema 2
        document.write("<h2>Problema 5.2</h2>")
        const num1 = parseFloat(prompt("1. Ingresa un numero: "))
        const num2 = parseFloat(prompt("2. Ingresa un numero: "))
        const num3 = parseFloat(prompt("3. Ingresa un numero: "))
        const num4 = parseFloat(prompt("4. Ingresa un numero: "))

        const sum = num1 + num2
        const product = num3 * num4
        document.write("<p> Numero 1: " + num1 + " </p>")
        document.write("<p> Numero 2: " + num2 + " </p>")
        document.write("<p> Numero 3: " + num3 + " </p>")
        document.write("<p> Numero 4: " + num4 + " </p>")
        document.write("<p> La suma es: " + sum + " </p>")
        document.write("<p> El producto es: " + product + " </p>")

        // //Problema 3
        document.write("<h2>Problema 5.3</h2>")
        const sumaTotal = num1 + num2 + num3 + num4
        const productoTotal = num1 * num2 * num3 * num4
        document.write("<p> La suma total es: " + sumaTotal + " </p>")
        document.write("<p> El producto total es: " + productoTotal + " </p>")

        // //Problema 4
        document.write("<h2>Problema 5.4</h2>")
        const precio = parseInt(prompt("Ingresar el precio del artículo: "))
        const cantidad = parseInt(prompt("Ingresar la cantidad a llevar: "))
        const total = precio * cantidad
        document.write("<p>Precio a abonar: $" + total + "</p>")
    </script>   
</body>
</html>
