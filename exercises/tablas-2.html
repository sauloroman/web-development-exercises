<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 — Tablas</title>

    <style>
        table, tr, th, td {
            border: 1px solid black;
        }
    </style>

</head>
<body>
    
    <table>
        <thead>
            <tr>
                <th>Categoría</th>
                <th>Etiquetas</th>
            </tr>
        </thead>
        <tbody>
            <tr><th rowspan="6">Formulario</th></tr>
            <tr><td>form</td></tr>
            <tr><td>button</td></tr>
            <tr><td>input</td></tr>
            <tr><td>select</td></tr>
            <tr><td>textarea</td></tr>

            <tr><th rowspan="6">Tabla</th></tr>
            <tr><td>table</td></tr>
            <tr><td>tr</td></tr>
            <tr><td>th</td></tr>
            <tr><td>td</td></tr>
            <tr><td>caption</td></tr>
            
            <tr><th rowspan="7">Texto</th></tr>
            <tr><td>b</td></tr>
            <tr><td>em</td></tr>
            <tr><td>i</td></tr>
            <tr><td>strong</td></tr>
            <tr><td>sub</td></tr>
            <tr><td>sup</td></tr>
        </tbody>
    </table>

</body>
</html>
