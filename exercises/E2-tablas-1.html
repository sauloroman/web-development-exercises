<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios 2 - Tablas 1</title>

    <style>
        table {
            border: 1px solid #888;
        }
        th, td {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    
    <table>
        <thead>
            <tr>
                <th>País</th>
                <th>Oro</th>
                <th>Plata</th>
                <th>Bronce</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>USA</td>
                <td>110</td>
                <td>115</td>
                <td>99</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>219</td>
                <td>247</td>
                <td>206</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
