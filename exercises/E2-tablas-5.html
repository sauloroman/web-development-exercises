<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios 2 - Tablas 5</title>

    <style>
        table {
            border: 1px solid #888;
        }
        th, td, tr {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>País</th>
                <th>Datos econ.</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">España</td>
            </tr>
            <tr><td>PIB:-0,1%</td></tr>
            <tr><td>Déficit:5%</td></tr>
            <tr><td>Paro:25.4%</td></tr>

            <tr>
                <td rowspan="4">USA</td>
            </tr>
            <tr><td>PIB:0.4%</td></tr>
            <tr><td>Déficit:3%</td></tr>
            <tr><td>Paro:11%</td></tr>
        </tbody>
    </table>
</body>
</html>
